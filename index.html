<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>QA Compass</title>
<style>
:root{color-scheme:light;--bg:#f4f6fb;--card:#fff;--ink:#1c2433;--mut:#6b7689;--line:#e3e8f1;--pri:#4f6df5;--pri2:#eef1ff;--ok:#1fa971;--bad:#e5484d;--warn:#e89a14;--info:#2b8ae0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:#fff;border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{font-weight:700;font-size:16px;padding:4px 10px 14px;display:flex;gap:8px;align-items:center}.logo i{background:var(--pri);color:#fff;border-radius:8px;width:28px;height:28px;display:grid;place-items:center;font-style:normal}
nav button{display:flex;width:100%;gap:10px;align-items:center;border:0;background:none;padding:9px 10px;border-radius:8px;color:var(--ink);font:inherit;cursor:pointer;text-align:left}
nav button:hover{background:var(--bg)}nav button.on{background:var(--pri2);color:var(--pri);font-weight:600}
nav small{display:block;color:var(--mut);padding:12px 10px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
nav .c{margin-left:auto;background:var(--bg);border-radius:10px;padding:0 7px;font-size:11px;color:var(--mut)}
main{padding:24px;max-width:1150px;width:100%}
h1{font-size:22px;margin:0 0 4px}h2{font-size:15px;margin:0 0 10px}.sub{color:var(--mut);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kpi b{display:block;font-size:26px;line-height:1.2}.kpi span{color:var(--mut);font-size:12px}
button.b{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}button.b:hover{filter:brightness(.95)}
button.s{background:#fff;color:var(--ink);border:1px solid var(--line)}button.d{background:#fff;color:var(--bad);border:1px solid var(--line)}
button.sm{padding:4px 9px;font-size:12px}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri2);border-color:var(--pri)}
textarea{min-height:70px;resize:vertical}label{display:block;font-size:12px;color:var(--mut);font-weight:600;margin:0 0 3px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.bar input,.bar select{width:auto;flex:1;min-width:130px}.bar .sp{flex:2}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}th{text-align:left;font-size:12px;color:var(--mut);padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}tr:hover td{background:#fafbfe}td select,td input{padding:4px 6px;font-size:13px;min-width:90px}
.bd{display:inline-block;padding:1px 9px;border-radius:10px;font-size:12px;font-weight:600;background:var(--bg);color:var(--mut);white-space:nowrap}
.ok{background:#e3f7ee;color:#127a52}.bad{background:#fde8e9;color:#b92a30}.warn{background:#fdf1dc;color:#9a6200}.info{background:#e2f0fc;color:#1d62a0}
.empty{text-align:center;color:var(--mut);padding:28px}
.fg{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.fg .w{grid-column:1/-1}
#m{position:fixed;inset:0;background:rgba(20,28,45,.4);display:none;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;z-index:20}
#m .box{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:720px}
.hb{height:9px;border-radius:5px;background:var(--bg);overflow:hidden}.hb i{display:block;height:100%;border-radius:5px}
.row{display:flex;gap:10px;align-items:center;margin:7px 0}.row span:first-child{width:90px;color:var(--mut);font-size:12px}.row .hb{flex:1}.row b{width:28px;text-align:right}
.donut{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;margin:auto}.donut div{background:#fff;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;text-align:center;font-weight:700;font-size:20px;line-height:1.1}
.steps{display:flex;gap:6px;flex-wrap:wrap}.steps span{background:var(--pri2);color:var(--pri);padding:4px 10px;border-radius:14px;font-size:12px;font-weight:600}
.av{width:72px;height:72px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:26px;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.chips button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 12px;cursor:pointer;font:inherit}.chips .on{background:var(--pri2);border-color:var(--pri);color:var(--pri)}
.rep h3{margin:16px 0 6px;font-size:14px}.rep table{min-width:0}
@media(max-width:820px){.app{grid-template-columns:1fr}aside{position:static;height:auto;border:0;border-bottom:1px solid var(--line)}nav{display:flex;overflow-x:auto;gap:4px}nav small{display:none}nav button{width:auto;white-space:nowrap}main{padding:14px}.logo{padding-bottom:8px}}
@media print{aside,.bar,.noprint{display:none!important}.app{display:block}main{padding:0}.card{border:0}}
</style></head><body>
<div class="app"><aside><div class="logo"><i>✓</i>QA Compass</div><nav id="nav"></nav></aside><main id="v"></main></div>
<div id="m" onclick="if(event.target===this)cm()"><div class="box" id="mb"></div></div>
<script>
const KEY='qa-intern-hub-v1',$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
db=db||{profile:{},cases:[],bugs:[],uat:[],plans:[],logs:[],sets:[],n:{}};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
const TYPES=['Functional','Smoke','Sanity','Regression','Integration','UI / UX','Usability','Compatibility','Performance','Security','API','Accessibility','Exploratory','Boundary / Negative'];
const ST={
cases:{t:'Test Cases',p:'TC',cols:['id','title','module','type','priority','status'],f:[['title','Title','text'],['module','Module / feature','text'],['type','Test type','sel',TYPES],['priority','Priority','sel',['High','Medium','Low']],['pre','Preconditions','area'],['data','Test data used','text'],['steps','Test steps','area'],['expected','Expected result','area'],['actual','Actual result','area'],['status','Status','sel',['Not Run','Pass','Fail','Blocked','Skipped']],['by','Executed by','text'],['date','Execution date','date']]},
bugs:{t:'Bug / Issue Tracker',p:'BUG',cols:['id','title','module','severity','priority','status'],f:[['title','Bug title / summary','text'],['module','Module / feature','text'],['severity','Severity','sel',['Blocker','Critical','Major','Minor','Trivial']],['priority','Priority','sel',['High','Medium','Low']],['status','Status','sel',['New','Open','In Progress','Fixed','Retest','Closed','Reopened','Rejected','Deferred']],['type','Issue type','sel',['Functional','UI','Performance','Security','Data','Usability','Compatibility','Typo / Content','Other']],['env','Environment','sel',['Dev','QA / Test','Staging','UAT','Production']],['build','Build / version','text'],['device','Browser / OS / device','text'],['case','Linked test case ID','text'],['steps','Steps to reproduce','area'],['expected','Expected result','area'],['actual','Actual result','area'],['attach','Screenshot / video / log link or filename','text'],['assignee','Assigned to (developer)','text'],['reporter','Reported by','text'],['date','Date found','date'],['notes','Comments / retest notes','area']]},
uat:{t:'UAT – User Acceptance Testing',p:'UAT',cols:['id','title','user','status','signer'],f:[['title','UAT scenario','text'],['req','Business requirement','text'],['user','Business user / participant','text'],['criteria','Acceptance criteria','area'],['steps','Steps performed','area'],['status','UAT result','sel',['Pending','In Testing','Accepted','Accepted with changes','Rejected']],['feedback','User feedback','area'],['signer','Signed off by','text'],['date','Sign-off date','date']]},
plans:{t:'Test Plans',p:'TP',cols:['id','name','start','end','env','status'],f:[['name','Plan name','text'],['scope','Scope (in / out)','area'],['types','Test types planned','text'],['env','Test environment','text'],['tools','Tools (Jira, Postman, Selenium…)','text'],['start','Start date','date'],['end','End date','date'],['entry','Entry criteria','area'],['exit','Exit criteria','area'],['risks','Risks & mitigation','area'],['status','Status','sel',['Draft','In Progress','Completed']]]},
logs:{t:'Internship Daily Log',p:'LOG',cols:['id','date','activity','hours'],f:[['date','Date','date'],['activity','What I did','area'],['learned','What I learned','area'],['hours','Hours','number'],['blockers','Blockers / questions for mentor','area']]}};
const PROF=[['name','Full name'],['school','University / school'],['major','Program / major'],['email','Email'],['company','Internship company'],['supervisor','Mentor / supervisor'],['start','Internship start','date'],['end','Internship end','date'],['skills','Skills (comma separated)','area'],['tools','Tools learning','area'],['goals','Internship goals','area']];
const NAV=[['home','▦','Dashboard'],['profile','☺','Profile'],['_','','Testing'],['plans','▤','Test Plans'],['cases','☑','Test Cases'],['bugs','⚑','Bugs / Issues'],['uat','✔','UAT System'],['data','▥','Dataset Upload'],['_','','Insights'],['report','◔','Reports'],['logs','✎','Daily Log']];
let view='home',q='',flt='',cur=0;
const badge=v=>{const x=String(v).toLowerCase();const c=['pass','accepted','closed','fixed','completed','low','trivial'].includes(x)?'ok':['fail','rejected','blocker','critical','reopened','high'].includes(x)?'bad':['blocked','major','medium','open','retest','pending','in progress','in testing','new','accepted with changes'].includes(x)?'warn':['minor','draft'].includes(x)?'info':'';return`<span class="bd ${c}">${esc(v)}</span>`};
const cnt=(a,k,v)=>a.filter(x=>x[k]===v).length,pct=(a,b)=>b?Math.round(a/b*100):0;
function go(v){view=v;q='';flt='';render();scrollTo(0,0)}
function render(){
$('#nav').innerHTML=NAV.map(n=>n[0]==='_'?`<small>${n[2]}</small>`:`<button class="${view===n[0]?'on':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}${db[n[0]]&&n[0]!=='profile'?`<span class="c">${db[n[0]].length}</span>`:''}</button>`).join('');
$('#v').innerHTML=view==='home'?home():view==='profile'?profile():view==='data'?data():view==='report'?report():list(view);}
/* ---------- Dashboard ---------- */
function home(){const c=db.cases,b=db.bugs,u=db.uat,ex=c.filter(x=>x.status!=='Not Run').length,ps=cnt(c,'status','Pass'),fl=cnt(c,'status','Fail'),bl=cnt(c,'status','Blocked');
const openB=b.filter(x=>!['Closed','Rejected','Deferred','Fixed'].includes(x.status)).length;
const d=`conic-gradient(var(--ok) 0 ${pct(ps,c.length)}%,var(--bad) 0 ${pct(ps+fl,c.length)}%,var(--warn) 0 ${pct(ps+fl+bl,c.length)}%,#dfe4ee 0)`;
const step=[['Understand requirements',db.plans.length],['Plan tests',db.plans.length],['Write test cases',c.length],['Execute tests',ex],['Report bugs',b.length],['Retest / regression',b.filter(x=>['Retest','Closed','Fixed'].includes(x.status)).length],['UAT sign-off',cnt(u,'status','Accepted')]];
return`<h1>Welcome${db.profile.name?', '+esc(db.profile.name.split(' ')[0]):''} 👋</h1><p class="sub">Your QA workspace — everything you enter is saved in this browser.</p>
${!c.length&&!b.length?`<div class="card"><b>New here?</b> Start by adding a test case or bug, or <button class="b sm" onclick="sample()">load sample data</button> to explore.</div>`:''}
<div class="grid"><div class="card kpi"><b>${c.length}</b><span>Test cases</span></div><div class="card kpi"><b>${pct(ps,ex)}%</b><span>Pass rate (executed)</span></div><div class="card kpi"><b>${openB}</b><span>Open bugs</span></div><div class="card kpi"><b>${pct(cnt(u,'status','Accepted')+cnt(u,'status','Accepted with changes'),u.length)}%</b><span>UAT accepted</span></div></div>
<div class="grid g2"><div class="card"><h2>Test execution status</h2><div class="donut" style="background:${d}"><div>${pct(ex,c.length)}%<br><small style="font-weight:400;font-size:11px;color:var(--mut)">executed</small></div></div><p style="text-align:center;color:var(--mut);font-size:12px">✔ ${ps} pass · ✖ ${fl} fail · ⏸ ${bl} blocked · ${cnt(c,'status','Not Run')} not run</p></div>
<div class="card"><h2>Bugs by severity</h2>${['Blocker','Critical','Major','Minor','Trivial'].map(s=>bar(s,cnt(b,'severity',s),b.length,s==='Blocker'||s==='Critical'?'var(--bad)':s==='Major'?'var(--warn)':'var(--info)')).join('')}</div></div>
<div class="card"><h2>QA lifecycle progress</h2><div class="steps">${step.map((s,i)=>`<span style="${s[1]?'':'opacity:.45'}">${i+1}. ${s[0]} ${s[1]?'✓':''}</span>`).join('')}</div></div>
<div class="card"><div class="bar"><h2 style="margin:0;flex:1">Recent bugs</h2><button class="b sm" onclick="go('bugs');edit('bugs')">+ Report bug</button><button class="s b sm" onclick="go('cases');edit('cases')">+ Test case</button></div>${b.length?`<div class="tw"><table>${b.slice(-5).reverse().map(x=>`<tr><td>${x.id}</td><td>${esc(x.title)}</td><td>${badge(x.severity)}</td><td>${badge(x.status)}</td></tr>`).join('')}</table></div>`:'<div class="empty">No bugs reported yet 🎉</div>'}</div>`}
const bar=(l,n,t,c)=>`<div class="row"><span>${l}</span><div class="hb"><i style="width:${pct(n,t)}%;background:${c}"></i></div><b>${n}</b></div>`;
/* ---------- Profile ---------- */
function profile(){const p=db.profile,s=p.start&&p.end?Math.max(0,Math.min(100,pct(Date.now()-new Date(p.start),new Date(p.end)-new Date(p.start)))):0;
return`<h1>Profile</h1><p class="sub">Your intern details and learning goals.</p><div class="card"><div class="bar" style="gap:16px"><div class="av">${esc((p.name||'QA').split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase())}</div><div><h2 style="margin:0">${esc(p.name||'Your name')}</h2><div style="color:var(--mut)">QA Intern${p.company?' · '+esc(p.company):''}</div></div></div>
${p.start&&p.end?`<label>Internship progress — ${s}%</label><div class="hb"><i style="width:${s}%;background:var(--pri)"></i></div><br>`:''}
<div class="fg">${PROF.map(f=>`<div class="${f[2]?'':f[0]==='skills'||f[0]==='tools'||f[0]==='goals'?'w':''}"><label>${f[1]}</label>${f[0]==='skills'||f[0]==='tools'||f[0]==='goals'?`<textarea id="p_${f[0]}">${esc(p[f[0]])}</textarea>`:`<input id="p_${f[0]}" type="${f[2]||'text'}" value="${esc(p[f[0]])}">`}</div>`).join('')}</div><br><button class="b" onclick="saveP()">Save profile</button></div>
<div class="card"><h2>Data tools</h2><button class="s b sm" onclick="sample()">Load sample data</button> <button class="s b sm" onclick="backup()">Backup / restore (JSON)</button> <button class="d b sm" onclick="if(confirm('Delete ALL data?')){db={profile:{},cases:[],bugs:[],uat:[],plans:[],logs:[],sets:[],n:{}};save();render()}">Reset everything</button></div>`}
function saveP(){PROF.forEach(f=>db.profile[f[0]]=$('#p_'+f[0]).value);save();render();alert('Profile saved ✓')}
/* ---------- Generic list ---------- */
function list(k){const S=ST[k],all=db[k],sf=S.f.find(f=>f[0]==='status'),rows=all.filter(x=>(!q||JSON.stringify(x).toLowerCase().includes(q.toLowerCase()))&&(!flt||x.status===flt));
return`<h1>${S.t}</h1><p class="sub">${k==='uat'?'Let business users validate that the software meets their needs, then record the sign-off.':k==='bugs'?'Log every defect with clear steps, severity and evidence so developers can reproduce it.':k==='cases'?'Design and execute test cases; update the status as you go.':k==='plans'?'Define scope, environment, tools, criteria and risks.':'Write down what you do and learn each day.'}</p>
<div class="card"><div class="bar"><input class="sp" placeholder="Search…" value="${esc(q)}" oninput="q=this.value;render2()" id="sq">${sf?`<select onchange="flt=this.value;render()"><option value="">All statuses</option>${sf[3].map(o=>`<option ${flt===o?'selected':''}>${o}</option>`).join('')}</select>`:''}<button class="b" onclick="edit('${k}')">+ New</button><button class="s b" onclick="csv('${k}')">Export CSV</button></div>
<div class="tw">${rows.length?`<table><tr>${S.cols.map(c=>`<th>${label(S,c)}</th>`).join('')}<th></th></tr>${rows.map(r=>`<tr>${S.cols.map(c=>{const f=S.f.find(f=>f[0]===c);return`<td>${c==='status'?`<select onchange="qs('${k}','${r.id}',this.value)">${f[3].map(o=>`<option ${r[c]===o?'selected':''}>${o}</option>`).join('')}</select>`:['severity','priority'].includes(c)?badge(r[c]||''):esc(r[c])}</td>`}).join('')}<td style="white-space:nowrap"><button class="s b sm" onclick="edit('${k}','${r.id}')">Edit</button> <button class="d b sm" onclick="del('${k}','${r.id}')">✕</button></td></tr>`).join('')}</table>`:`<div class="empty">Nothing here yet. Click <b>+ New</b> to add your first entry.</div>`}</div></div>`}
function render2(){const p=$('#sq').selectionStart;render();const e=$('#sq');e.focus();e.setSelectionRange(p,p)}
const label=(S,c)=>c==='id'?'ID':(S.f.find(f=>f[0]===c)||[0,c])[1];
function qs(k,id,v){db[k].find(x=>x.id===id).status=v;save();render()}
function del(k,id){if(confirm('Delete '+id+'?')){db[k]=db[k].filter(x=>x.id!==id);save();render()}}
function edit(k,id){const S=ST[k],r=id?db[k].find(x=>x.id===id):{};
mo(`<h2>${id?'Edit '+id:'New entry — '+S.t}</h2><div class="fg">${S.f.map(f=>`<div class="${f[2]==='area'?'w':''}"><label>${f[1]}</label>${f[2]==='sel'?`<select id="f_${f[0]}">${f[3].map(o=>`<option ${(r[f[0]]||f[3][0])===o?'selected':''}>${o}</option>`).join('')}</select>`:f[2]==='area'?`<textarea id="f_${f[0]}">${esc(r[f[0]])}</textarea>`:`<input id="f_${f[0]}" type="${f[2]}" value="${esc(r[f[0]]??(f[2]==='date'&&!id?new Date().toISOString().slice(0,10):''))}">`}</div>`).join('')}</div><br><button class="b" onclick="sv('${k}','${id||''}')">Save</button> <button class="s b" onclick="cm()">Cancel</button>`)}
function sv(k,id){const S=ST[k],o=id?db[k].find(x=>x.id===id):{};S.f.forEach(f=>o[f[0]]=$('#f_'+f[0]).value);
if(!o.title&&!o.name&&!o.activity&&!o.date)return alert('Please fill in at least one main field.');
if(!id){db.n[k]=(db.n[k]||0)+1;o.id=S.p+'-'+String(db.n[k]).padStart(3,'0');db[k].push(o)}save();cm();render()}
function csv(k){const S=ST[k],h=['id',...S.f.map(f=>f[0])];txt(S.t+' (CSV)',[h.join(','),...db[k].map(r=>h.map(c=>q2(r[c])).join(','))].join('\n'))}
const q2=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
/* ---------- Modal ---------- */
function mo(h){$('#mb').innerHTML=h;$('#m').style.display='flex'}function cm(){$('#m').style.display='none'}
function txt(t,s){mo(`<h2>${t}</h2><p class="sub">Select all and copy, or press the button.</p><textarea id="tx" style="min-height:260px;font-family:monospace;font-size:12px">${esc(s)}</textarea><br><br><button class="b" onclick="cp()">Copy to clipboard</button> <button class="s b" onclick="cm()">Close</button>`)}
function cp(){const t=$('#tx');t.select();try{navigator.clipboard.writeText(t.value)}catch(e){try{document.execCommand('copy')}catch(x){}}}
function backup(){mo(`<h2>Backup / restore</h2><p class="sub">Copy this JSON to back up. To restore, paste a backup and press Restore.</p><textarea id="tx" style="min-height:240px;font-family:monospace;font-size:12px">${esc(JSON.stringify(db))}</textarea><br><br><button class="b" onclick="cp()">Copy</button> <button class="s b" onclick="try{db=JSON.parse($('#tx').value);save();cm();render()}catch(e){alert('Invalid JSON')}">Restore</button>`)}
/* ---------- Dataset ---------- */
function parse(t){const d=t.split('\n')[0].includes('\t')?'\t':t.split('\n')[0].split(';').length>t.split('\n')[0].split(',').length?';':',';const R=[];let r=[],c='',iq=false;
for(let i=0;i<t.length;i++){const ch=t[i];if(iq){if(ch==='"'&&t[i+1]==='"'){c+='"';i++}else if(ch==='"')iq=false;else c+=ch}else if(ch==='"')iq=true;else if(ch===d){r.push(c);c=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);R.push(r);r=[];c=''}else c+=ch}
if(c||r.length){r.push(c);R.push(r)}return R.filter(x=>x.some(v=>v.trim()!==''))}
function addSet(name,cols,rows){db.sets.push({name,cols,rows});cur=db.sets.length-1;save();render()}
function up(inp){[...inp.files].forEach(f=>{const rd=new FileReader();rd.onload=()=>{try{let t=rd.result;if(f.name.endsWith('.json')){let j=JSON.parse(t);if(!Array.isArray(j))j=[j];const cols=[...new Set(j.flatMap(o=>Object.keys(o)))];addSet(f.name,cols,j.map(o=>cols.map(c=>typeof o[c]==='object'?JSON.stringify(o[c]):String(o[c]??''))))}else{const R=parse(t);addSet(f.name,R[0],R.slice(1).map(r=>R[0].map((_,i)=>r[i]??'')))}}catch(e){alert('Could not read '+f.name)}};rd.readAsText(f)});inp.value=''}
function pasteSet(){const t=$('#paste').value.trim();if(!t)return;const R=parse(t);addSet('Pasted data '+(db.sets.length+1),R[0],R.slice(1).map(r=>R[0].map((_,i)=>r[i]??'')))}
function blank(){const n=$('#bn').value||'New dataset',c=($('#bc').value||'Name,Value').split(',').map(x=>x.trim()).filter(Boolean);addSet(n,c,[c.map(()=>'')])}
function data(){const s=db.sets[cur];let v='';
if(s){const R=s.rows,emp=R.flat().filter(x=>String(x).trim()==='').length,dup=R.length-new Set(R.map(r=>r.join('\u0001'))).size;
v=`<div class="card"><div class="bar"><h2 style="margin:0;flex:2">${esc(s.name)}</h2><button class="s b sm" onclick="addRow()">+ Row</button><button class="s b sm" onclick="addCol()">+ Column</button><button class="s b sm" onclick="txt('${esc(s.name)}',[s.cols,...s.rows].map(r=>r.map(q2).join(',')).join('\\n'))">Export CSV</button><button class="d b sm" onclick="if(confirm('Delete dataset?')){db.sets.splice(cur,1);cur=0;save();render()}">Delete</button></div>
<div class="grid" style="margin-bottom:12px"><div class="kpi"><b>${R.length}</b><span>Rows</span></div><div class="kpi"><b>${s.cols.length}</b><span>Columns</span></div><div class="kpi"><b style="color:${emp?'var(--warn)':'var(--ok)'}">${emp}</b><span>Empty cells</span></div><div class="kpi"><b style="color:${dup?'var(--bad)':'var(--ok)'}">${dup}</b><span>Duplicate rows</span></div></div>
<div class="tw" style="max-height:420px"><table><tr><th>#</th>${s.cols.map((c,i)=>`<th><input value="${esc(c)}" onchange="db.sets[cur].cols[${i}]=this.value;save()" style="font-weight:700"></th>`).join('')}<th></th></tr>${R.slice(0,100).map((r,ri)=>`<tr><td>${ri+1}</td>${s.cols.map((_,ci)=>`<td><input value="${esc(r[ci])}" onchange="db.sets[cur].rows[${ri}][${ci}]=this.value;save()" style="${String(r[ci]).trim()===''?'background:#fff6e5':''}"></td>`).join('')}<td><button class="d b sm" onclick="db.sets[cur].rows.splice(${ri},1);save();render()">✕</button></td></tr>`).join('')}</table></div>${R.length>100?`<p class="sub">Showing first 100 of ${R.length} rows.</p>`:''}<p class="sub" style="margin-top:8px">Cells highlighted in yellow are empty. Edit any cell directly — changes save automatically.</p></div>`}
return`<h1>Dataset Upload</h1><p class="sub">Upload test data (CSV, TSV, JSON), paste it, or build your own table. Check quality before using it in tests.</p>
<div class="card"><div class="grid g2"><div><h2>Upload file</h2><input type="file" accept=".csv,.tsv,.txt,.json" multiple onchange="up(this)"></div><div><h2>Create blank dataset</h2><div class="bar"><input id="bn" placeholder="Name"><input id="bc" placeholder="Columns: Username,Password,Role"><button class="b" onclick="blank()">Create</button></div></div></div><br><h2>Or paste CSV</h2><textarea id="paste" placeholder="name,email,age&#10;Ali,ali@test.com,21"></textarea><br><br><button class="b" onclick="pasteSet()">Import pasted data</button></div>
${db.sets.length?`<div class="chips">${db.sets.map((x,i)=>`<button class="${i===cur?'on':''}" onclick="cur=${i};render()">${esc(x.name)}</button>`).join('')}</div>`:''}${v}`}
function addRow(){const s=db.sets[cur];s.rows.push(s.cols.map(()=>''));save();render()}
function addCol(){const n=prompt('Column name?');if(n){const s=db.sets[cur];s.cols.push(n);s.rows.forEach(r=>r.push(''));save();render()}}
/* ---------- Report ---------- */
function report(){const c=db.cases,b=db.bugs,u=db.uat,r=db.rep||(db.rep={}),ex=c.filter(x=>x.status!=='Not Run').length,ps=cnt(c,'status','Pass'),fl=cnt(c,'status','Fail'),bl=cnt(c,'status','Blocked'),sk=cnt(c,'status','Skipped');
const op=b.filter(x=>!['Closed','Rejected','Deferred','Fixed'].includes(x.status)),crit=op.filter(x=>['Blocker','Critical'].includes(x.severity)).length,rate=pct(ps,ex);
const go=!c.length?'N/A':crit>0||rate<85?'NO-GO':'GO';const mods=[...new Set(c.map(x=>x.module||'(none)'))];
const uAcc=cnt(u,'status','Accepted')+cnt(u,'status','Accepted with changes');
const inp=(k,l,t)=>`<div><label>${l}</label><input type="${t||'text'}" value="${esc(r[k])}" oninput="db.rep.${k}=this.value;save()" onchange="render()"></div>`;
return`<h1>Test Report</h1><p class="sub">Generated automatically from your test status. Fill in the details, then print or copy.</p>
<div class="card noprint"><div class="fg">${inp('project','Project / application')}${inp('build','Build / version')}${inp('env','Environment')}${inp('from','Test period from','date')}${inp('to','To','date')}${inp('tester','Prepared by')}</div><br><label>Summary &amp; recommendation (your own words)</label><textarea oninput="db.rep.note=this.value;save()" onchange="render()">${esc(r.note)}</textarea><br><br><button class="b" onclick="window.print()">Print / Save as PDF</button> <button class="s b" onclick="txt('Report (plain text)',rtxt())">Copy as text</button></div>
<div class="card rep" id="rep"><h2 style="font-size:19px">${esc(r.project||'Project')} — Test Summary Report</h2><div style="color:var(--mut)">Build ${esc(r.build||'-')} · ${esc(r.env||'-')} · ${esc(r.from||'')} → ${esc(r.to||'')} · by ${esc(r.tester||db.profile.name||'-')} · generated ${new Date().toLocaleDateString()}</div>
<h3>Overall result</h3><p><b style="font-size:20px;color:${go==='GO'?'var(--ok)':go==='NO-GO'?'var(--bad)':'var(--mut)'}">${go}</b> <span style="color:var(--mut)">(suggested: no open Blocker/Critical bugs and pass rate ≥ 85%)</span></p>${r.note?`<p>${esc(r.note).replace(/\n/g,'<br>')}</p>`:''}
<h3>Test execution</h3><div class="grid"><div class="kpi"><b>${c.length}</b><span>Total cases</span></div><div class="kpi"><b>${pct(ex,c.length)}%</b><span>Executed</span></div><div class="kpi"><b style="color:var(--ok)">${rate}%</b><span>Pass rate</span></div><div class="kpi"><b style="color:var(--bad)">${fl}</b><span>Failed</span></div><div class="kpi"><b style="color:var(--warn)">${bl}</b><span>Blocked</span></div></div><br>
${['Pass','Fail','Blocked','Skipped','Not Run'].map(s=>bar(s,cnt(c,'status',s),c.length,s==='Pass'?'var(--ok)':s==='Fail'?'var(--bad)':s==='Blocked'?'var(--warn)':'#b9c1d1')).join('')}
<h3>Results by module</h3><div class="tw">${mods.length?`<table><tr><th>Module</th><th>Total</th><th>Pass</th><th>Fail</th><th>Blocked</th><th>Not run</th><th>Pass %</th></tr>${mods.map(m=>{const a=c.filter(x=>(x.module||'(none)')===m);return`<tr><td>${esc(m)}</td><td>${a.length}</td><td>${cnt(a,'status','Pass')}</td><td>${cnt(a,'status','Fail')}</td><td>${cnt(a,'status','Blocked')}</td><td>${cnt(a,'status','Not Run')}</td><td>${pct(cnt(a,'status','Pass'),a.length)}%</td></tr>`}).join('')}</table>`:'<div class="empty">No test cases</div>'}</div>
<h3>Defects</h3><p>${b.length} reported · ${op.length} open · ${crit} open Blocker/Critical · ${cnt(b,'status','Closed')} closed · ${cnt(b,'status','Reopened')} reopened · defect density ${c.length?(b.length/c.length).toFixed(2):0} per test case</p>
${['Blocker','Critical','Major','Minor','Trivial'].map(s=>bar(s,cnt(b,'severity',s),b.length,s==='Blocker'||s==='Critical'?'var(--bad)':s==='Major'?'var(--warn)':'var(--info)')).join('')}
${op.length?`<h3>Open defects</h3><div class="tw"><table>${op.map(x=>`<tr><td>${x.id}</td><td>${esc(x.title)}</td><td>${badge(x.severity)}</td><td>${badge(x.status)}</td></tr>`).join('')}</table></div>`:''}
<h3>User acceptance (UAT)</h3><p>${u.length} scenarios · ${cnt(u,'status','Accepted')} accepted · ${cnt(u,'status','Accepted with changes')} with changes · ${cnt(u,'status','Rejected')} rejected · ${cnt(u,'status','Pending')+cnt(u,'status','In Testing')} pending · acceptance ${pct(uAcc,u.length)}%</p></div>`}
function rtxt(){const c=db.cases,b=db.bugs,u=db.uat,r=db.rep||{},ex=c.filter(x=>x.status!=='Not Run').length,ps=cnt(c,'status','Pass');
return[`TEST SUMMARY REPORT — ${r.project||'Project'}`,`Build: ${r.build||'-'} | Env: ${r.env||'-'} | ${r.from||''} to ${r.to||''} | By: ${r.tester||db.profile.name||'-'}`,'',`Test cases: ${c.length} (executed ${ex}, pass ${ps}, fail ${cnt(c,'status','Fail')}, blocked ${cnt(c,'status','Blocked')}, not run ${cnt(c,'status','Not Run')})`,`Pass rate: ${pct(ps,ex)}%`,`Bugs: ${b.length} (open ${b.filter(x=>!['Closed','Rejected','Deferred','Fixed'].includes(x.status)).length}, closed ${cnt(b,'status','Closed')})`,`UAT: ${u.length} scenarios, accepted ${cnt(u,'status','Accepted')}, rejected ${cnt(u,'status','Rejected')}`,'',r.note||''].join('\n')}
/* ---------- Sample ---------- */
function sample(){const add=(k,a)=>a.forEach(o=>{db.n[k]=(db.n[k]||0)+1;o.id=ST[k].p+'-'+String(db.n[k]).padStart(3,'0');db[k].push(o)});
add('cases',[{title:'Login with valid credentials',module:'Login',type:'Smoke',priority:'High',steps:'1. Open login page\n2. Enter valid email/password\n3. Click Login',expected:'User lands on dashboard',status:'Pass'},{title:'Login with wrong password',module:'Login',type:'Boundary / Negative',priority:'High',expected:'Error message shown',actual:'No error shown',status:'Fail'},{title:'Add item to cart',module:'Cart',type:'Functional',priority:'Medium',status:'Pass'},{title:'Checkout with expired card',module:'Checkout',type:'Boundary / Negative',priority:'High',status:'Blocked'},{title:'Page loads under 3s',module:'Checkout',type:'Performance',priority:'Low',status:'Not Run'}]);
add('bugs',[{title:'No error message on wrong password',module:'Login',severity:'Major',priority:'High',status:'Open',type:'Functional',env:'QA / Test',case:'TC-002',steps:'Enter wrong password and submit',expected:'Error shown',actual:'Page reloads silently'},{title:'Cart total not updated after removing item',module:'Cart',severity:'Critical',priority:'High',status:'In Progress',type:'Functional',env:'Staging'},{title:'Typo on checkout button',module:'Checkout',severity:'Trivial',priority:'Low',status:'Closed',type:'Typo / Content',env:'QA / Test'}]);
add('uat',[{title:'Customer can place an order end-to-end',req:'REQ-12',user:'Sales manager',status:'Accepted',criteria:'Order confirmation email received'},{title:'Admin can export monthly sales',req:'REQ-18',user:'Finance',status:'Pending'}]);
add('plans',[{name:'Release 1.0 Test Plan',scope:'Login, Cart, Checkout',types:'Smoke, Functional, Regression',env:'QA',tools:'Jira, Postman',status:'In Progress'}]);
if(!db.sets.length)db.sets.push({name:'sample-users.csv',cols:['username','email','role'],rows:[['ali','ali@test.com','admin'],['siti','siti@test.com','user'],['','nobody@test.com','user'],['ali','ali@test.com','admin']]});
save();render()}
render();
</script></body></html>
